<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Macro Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./finish-your-day.js"></script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Macro Log" />
<meta name="theme-color" content="#0D1110" />
<style>
  :root {
    --bg: #0D1110;
    --panel: #161C1A;
    --ink: #EAEFEC;
    --muted: #8CA39A;
    --line: #2A332F;
    --protein: #6FCF97;
    --fat: #F2C94C;
    --carb: #56B6E9;
    --over: #FF6B6B;
    --font-display: 'Arial Narrow', 'Helvetica Neue Condensed', Helvetica, Arial, sans-serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); overscroll-behavior-y: none; }
  body { font-family: var(--font-body); color: var(--ink); touch-action: manipulation; }
  #mt-root { padding: 22px 18px 110px; padding-top: max(22px, env(safe-area-inset-top)); max-width: 640px; margin: 0 auto; min-height: 100vh; }
  button { touch-action: manipulation; }

  .mt-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; line-height: 1.6; }
  .mt-title { font-family: var(--font-display); font-weight: 800; font-stretch: condensed; font-size: 30px; letter-spacing: -0.01em; margin: 0 0 22px; }

  .mt-datebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .mt-datebar button { background: var(--ink); color: var(--bg); border: none; width: 46px; height: 46px; font-size: 19px; cursor: pointer; font-family: var(--font-mono); border-radius: 8px; }
  .mt-datebar button:disabled { opacity: 0.3; cursor: default; }
  .mt-date-label { font-family: var(--font-mono); font-size: 15px; font-weight: 600; text-align: center; flex: 1; }
  .mt-date-sub { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; font-weight: 400; }

  .mt-label { background: var(--panel); border: 3px solid var(--ink); padding: 16px 16px 10px; margin-bottom: 26px; border-radius: 4px; }
  .mt-label-head { font-family: var(--font-display); font-weight: 800; font-stretch: condensed; font-size: 26px; letter-spacing: -0.01em; border-bottom: 9px solid var(--ink); padding-bottom: 8px; margin-bottom: 8px; }
  .mt-label-sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; border-bottom: 5px solid var(--ink); padding-bottom: 8px; margin-bottom: 8px; }
  .mt-cal-row { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 9px solid var(--ink); padding: 8px 0; margin-bottom: 3px; }
  .mt-cal-row .mt-row-label { font-family: var(--font-display); font-weight: 800; font-size: 20px; font-stretch: condensed; }
  .mt-cal-row .mt-row-val { font-family: var(--font-mono); font-size: 26px; font-weight: 700; }
  .mt-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .mt-row:last-child { border-bottom: none; }
  .mt-row-name { font-weight: 700; }
  .mt-row-amt { font-family: var(--font-mono); color: var(--muted); text-align: right; min-width: 90px; }
  .mt-row-pct { font-family: var(--font-mono); font-weight: 700; text-align: right; min-width: 44px; }
  .mt-bar-track { grid-column: 1 / -1; height: 6px; background: var(--line); position: relative; overflow: hidden; border-radius: 3px; }
  .mt-bar-fill { height: 100%; }
  .mt-swatch { width: 9px; height: 9px; display: inline-block; margin-right: 6px; border-radius: 1px; }

  .mt-section-title { font-family: var(--font-display); font-weight: 800; font-stretch: condensed; font-size: 18px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 3px solid var(--ink); padding-bottom: 8px; margin: 34px 0 14px; display: flex; align-items: center; gap: 8px; }
  .mt-form { background: var(--panel); border: 1px solid var(--line); padding: 16px; margin-bottom: 22px; border-radius: 6px; }
  .mt-form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .mt-form input, .mt-form select { font-family: var(--font-body); border: 1px solid var(--line); background: var(--panel); padding: 13px 12px; font-size: 16px; width: 100%; color: var(--ink); border-radius: 6px; min-height: 46px; }
  .mt-form input:focus, .mt-form select:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .mt-form-name { flex: 2 1 160px; }
  .mt-form-num { flex: 1 1 70px; min-width: 0; }
  .mt-form-meal { flex: 1 1 100px; }
  .mt-form label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; letter-spacing: 0.05em; }
  .mt-add-btn { background: var(--ink); color: var(--bg); border: none; padding: 15px 16px; font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; width: 100%; min-height: 50px; border-radius: 6px; }
  .mt-add-btn:hover { opacity: 0.85; }
  .mt-add-btn:disabled { opacity: 0.5; cursor: default; }

  .mt-log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; min-height: 44px; }
  .mt-log-meal { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-top: 6px; }
  .mt-log-macros { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; }
  .mt-del { background: none; border: none; color: var(--over); cursor: pointer; font-size: 22px; padding: 10px 4px 10px 16px; line-height: 1; min-width: 44px; min-height: 44px; }
  .mt-empty { color: var(--muted); font-size: 13px; padding: 18px 0; text-align: center; font-style: italic; }

  .mt-hist-item { background: var(--panel); border: 1px solid var(--line); padding: 16px 14px; margin-bottom: 10px; cursor: pointer; border-radius: 6px; min-height: 44px; }
  .mt-hist-head { display: flex; justify-content: space-between; align-items: center; }
  .mt-hist-date { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
  .mt-hist-cal { font-family: var(--font-mono); font-size: 13px; }
  .mt-hist-bars { display: flex; gap: 3px; margin-top: 10px; height: 6px; }
  .mt-hist-bars > div { flex: 1; background: var(--line); position: relative; overflow: hidden; border-radius: 2px; }
  .mt-hist-bars > div > span { display: block; height: 100%; }
  .mt-hist-detail { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; gap: 14px; }

  .mt-week-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 22px; border-radius: 6px; overflow: hidden; }
  .mt-week-cell { background: var(--panel); padding: 14px 8px; text-align: center; }
  .mt-week-cell .mt-week-num { font-family: var(--font-mono); font-weight: 700; font-size: 17px; display: block; }
  .mt-week-cell .mt-week-lbl { font-family: var(--font-mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .mt-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--panel); border-left: 3px solid var(--ink); padding: 10px 12px; margin-bottom: 22px; border-radius: 0 6px 6px 0; line-height: 1.6; }
  .mt-loading { text-align: center; padding: 60px 0; font-family: var(--font-mono); color: var(--muted); }

  .mt-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .mt-tab { flex: 1; text-align: center; padding: 12px 6px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; border-radius: 6px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .mt-tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .mt-tab.symptom-active { background: var(--over); color: #fff; border-color: var(--over); }

  .mt-sev-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .mt-sev-btn { flex: 1; padding: 11px 4px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; border-radius: 6px; min-height: 44px; }
  .mt-sev-btn.active { background: var(--over); border-color: var(--over); color: #fff; }

  .mt-symptom-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; background: rgba(255,107,107,0.08); margin: 0 -14px; padding-left: 14px; padding-right: 6px; min-height: 44px; }
  .mt-symptom-tag { display: inline-block; font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--over); color: #fff; padding: 3px 7px; border-radius: 3px; margin-right: 8px; }
  .mt-hist-symptom-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--over); display: inline-block; margin-left: 6px; }
  .mt-fab { position: fixed; right: 20px; bottom: max(20px, env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: var(--bg); border: none; font-size: 28px; line-height: 1; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.45); z-index: 5; display: flex; align-items: center; justify-content: center; }
  .mt-sync { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: right; margin-top: -10px; margin-bottom: 18px; }
  .mt-sync.err { color: var(--over); }

  /* Setup modal */
  .mt-modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .mt-modal { background: var(--panel); border: 3px solid var(--ink); max-width: 380px; width: 100%; padding: 22px; border-radius: 8px; }
  .mt-modal h2 { font-family: var(--font-display); font-stretch: condensed; font-size: 20px; margin: 0 0 12px; }
  .mt-modal p { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  .mt-modal label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; color: var(--muted); display: block; margin: 10px 0 4px; letter-spacing: 0.05em; }
  .mt-modal input { width: 100%; font-family: var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 13px 12px; font-size: 16px; border-radius: 6px; min-height: 46px; }
  .mt-modal-err { color: var(--over); font-family: var(--font-mono); font-size: 11px; margin-top: 10px; }

  .mt-preset-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .mt-preset-pill { background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 9px 13px; border-radius: 20px; cursor: pointer; min-height: 38px; }
  .mt-preset-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .mt-priority { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 4px; }

  .mt-trends { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; margin-bottom: 22px; }
  .mt-insight { display: flex; align-items: flex-start; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; }
  .mt-insight:last-child { border-bottom: none; }
  .mt-insight .em { flex-shrink: 0; font-size: 15px; width: 20px; text-align: center; }

  .mt-finish { background: var(--panel); border: 1px solid var(--protein); border-radius: 10px; padding: 14px 16px; margin-bottom: 22px; }
  .mt-finish-head { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--protein); margin-bottom: 10px; }
  .mt-finish-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .mt-finish-item:last-child { border-bottom: none; }
  .mt-finish-item .name { font-weight: 700; }
  .mt-finish-item .macros { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<style>.hub-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:44px;background:#0D1110;border-bottom:1px solid #2A332F;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:50}.hub-nav a{color:#4FD9AE;text-decoration:none;display:flex;align-items:center;gap:4px;padding:6px 8px;margin:-6px -8px;font-weight:600}.hub-nav .hub-nav-title{color:#8CA39A;font-size:11px}</style>
<div class="hub-nav"><a href="https://aaronlikeshoobs.github.io/fitness-hub/">&larr; Hub</a><span class="hub-nav-title">Macro Log</span></div>
<div id="mt-root"><div class="mt-loading">loading log&hellip;</div></div>

<script>
(function() {
  const root = document.getElementById('mt-root');
  const DEFAULT_TARGETS = { cal: 1750, protein: 170, fat: 55, carb: 145 };
  function deriveDefaultPresets(std) {
    const mk = (protein, fat, carb, label) => ({ label, cal: protein*4 + fat*9 + carb*4, protein, fat, carb });
    return {
      standard:   { ...std, label: 'Standard' },
      rest:       mk(std.protein, std.fat + 5, Math.max(0, std.carb - 35), 'Rest Day'),
      longRide:   mk(std.protein, std.fat, std.carb + 115, 'Long Ride'),
      heavyLower: mk(std.protein + 10, std.fat, std.carb + 30, 'Heavy Lower'),
    };
  }
  const SEED_ENTRIES = [];
  const LS_PASSWORD = 'app-password';

  let autoFocusPending = true;
  let sha = null; // current data.json sha, for updates
  let pendingErrMsg = null;
  const LS_QUEUE = 'mt-offline-queue';
  let state = {
    entries: SEED_ENTRIES,
    targetPresets: deriveDefaultPresets(DEFAULT_TARGETS),
    dayTypes: {},
    currentDate: todayStr(), loaded: false, syncErr: null, syncing: false, entryTab: 'meal', severity: 'Mild',
    vitalsWeight: null, needsPassword: false,
  };

  function loadQueue() { try { return JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch(e) { return []; } }
  function saveQueue(q) { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ---- Storage, proxied through repo-proxy Worker — no GitHub token in this file, ever ----
  const REPO_WORKER_URL = 'https://repo-proxy.restless-union-743f.workers.dev';

  async function ghGet() {
    const res = await fetch(`${REPO_WORKER_URL}/?repo=macro-log`);
    if (!res.ok) throw new Error('Read failed: ' + res.status);
    const json = await res.json();
    sha = json.sha;
    return json.content || {};
  }

  async function ghPut(dataObj, retried) {
    const pw = localStorage.getItem(LS_PASSWORD);
    if (!pw) {
      state.needsPassword = true;
      throw new Error('App password needed to save');
    }
    const res = await fetch(`${REPO_WORKER_URL}/?repo=macro-log`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-App-Password': pw },
      body: JSON.stringify({ content: dataObj, sha }),
    });
    if (res.status === 401) {
      localStorage.removeItem(LS_PASSWORD);
      state.needsPassword = true;
      throw new Error('Wrong app password');
    }
    if (res.status === 409 && !retried) {
      // our sha is stale (file changed elsewhere) — refetch latest, merge our entries in, retry once
      const latest = await ghGet(); // also refreshes module-level `sha`
      const remoteEntries = latest.entries || [];
      const remoteIds = new Set(remoteEntries.map(e => e.id));
      const oursOnly = (dataObj.entries || []).filter(e => !remoteIds.has(e.id));
      const merged = {
        entries: [...remoteEntries, ...oursOnly],
        targetPresets: dataObj.targetPresets || latest.targetPresets,
        dayTypes: { ...(latest.dayTypes || {}), ...(dataObj.dayTypes || {}) },
        targets: dataObj.targets || latest.targets,
      };
      state.entries = merged.entries;
      state.targetPresets = merged.targetPresets;
      state.dayTypes = merged.dayTypes;
      return ghPut(merged, true);
    }
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const json = await res.json();
    sha = json.sha;
  }

  const WORKER_URL = 'https://macro-log-proxy.restless-union-743f.workers.dev/';

  async function estimateItems(description) {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description }),
    });
    if (!res.ok) throw new Error('Estimate failed: ' + res.status);
    const parsed = await res.json();
    if (parsed.error) throw new Error(parsed.error);
    const items = Array.isArray(parsed.items) ? parsed.items : [parsed];
    return items.map(it => ({
      name: it.name || description,
      cal: Math.round(Number(it.cal)) || 0,
      protein: Math.round(Number(it.protein)) || 0,
      fat: Math.round(Number(it.fat)) || 0,
      carb: Math.round(Number(it.carb)) || 0,
    }));
  }

  async function loadData() {
    try {
      const data = await ghGet();
      state.entries = data.entries || SEED_ENTRIES;
      state.targetPresets = data.targetPresets || deriveDefaultPresets(data.targets || DEFAULT_TARGETS);
      state.dayTypes = data.dayTypes || {};
      state.syncErr = null;
    } catch (e) {
      state.syncErr = e.message;
    }
    // merge any entries saved locally while offline/errored, that never made it to GitHub
    const queue = loadQueue();
    if (queue.length) {
      const existingIds = new Set(state.entries.map(e => e.id));
      queue.forEach(qe => { if (!existingIds.has(qe.id)) state.entries.push(qe); });
    }
    state.loaded = true;
    render();
    if (queue.length && !state.syncErr) { await persist(); } // flush queue now that we're connected
    // best-effort, non-blocking: pull weight history from Vitals Log for the trends section
    fetch('https://raw.githubusercontent.com/aaronlikeshoobs/vitals-log/main/data.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.weight) { state.vitalsWeight = d.weight; render(); } })
      .catch(() => {});
  }

  async function persist() {
    state.syncing = true; render();
    try {
      await ghPut({ entries: state.entries, targetPresets: state.targetPresets, dayTypes: state.dayTypes, targets: state.targetPresets.standard });
      state.syncErr = null;
      saveQueue([]); // fully synced, clear any queued backup
    } catch (e) {
      state.syncErr = state.needsPassword ? null : e.message + ' \u2014 saved locally, will retry on next open';
    }
    state.syncing = false; render();
  }

  function fmtDateLabel(dstr) {
    const [y,m,d] = dstr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const isToday = dstr === todayStr();
    return { label: dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }), isToday };
  }
  function shiftDate(dstr, delta) {
    const [y,m,d] = dstr.split('-').map(Number);
    const dt = new Date(y, m-1, d); dt.setDate(dt.getDate() + delta);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  }
  function totalsFor(dstr) {
    return state.entries.filter(e => e.date === dstr).reduce((acc, e) => {
      acc.cal += Number(e.cal)||0; acc.protein += Number(e.protein)||0;
      acc.fat += Number(e.fat)||0; acc.carb += Number(e.carb)||0;
      return acc;
    }, { cal: 0, protein: 0, fat: 0, carb: 0 });
  }
  function pct(val, target) { return target ? Math.round((val/target)*100) : 0; }
  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  function targetForDate(d) {
    const key = state.dayTypes[d];
    return (key && state.targetPresets[key]) || state.targetPresets.standard;
  }
  function rangeFor(target, tol) { return { lo: Math.round(target * (1 - tol)), hi: Math.round(target * (1 + tol)) }; }

  // mode 'min': never flag "over" — more is fine (protein). mode 'range': flag over only outside tolerance.
  function macroRow(label, colorVar, val, target, unit, opts) {
    opts = opts || {};
    const tol = opts.tolerance != null ? opts.tolerance : 0.12;
    const over = opts.mode !== 'min' && val > target * (1 + tol);
    const met = opts.mode === 'min' && val >= target;
    const p = pct(val, target);
    const fillColor = over ? 'var(--over)' : `var(${colorVar})`;
    const pctColor = over ? 'var(--over)' : met ? 'var(--protein)' : 'var(--ink)';
    return `
      <div class="mt-row">
        <div class="mt-row-name"><span class="mt-swatch" style="background:var(${colorVar})"></span>${label}</div>
        <div class="mt-row-amt">${val}${unit} / ${opts.mode === 'min' ? target + unit + ' min' : target + unit}</div>
        <div class="mt-row-pct" style="color:${pctColor}">${p}%</div>
        <div class="mt-bar-track"><div class="mt-bar-fill" style="width:${Math.min(p,100)}%; background:${fillColor}"></div></div>
      </div>`;
  }

  function priorityHint(t, tg, calRange) {
    if (t.protein < tg.protein) return { icon: '🎯', text: `${tg.protein - t.protein}g more protein to hit today's minimum` };
    if (t.cal > calRange.hi) return { icon: '⚠️', text: `${t.cal - tg.cal} kcal over — protein's covered, ease off the rest` };
    if (t.protein === 0 && t.cal === 0) return { icon: '📝', text: 'Nothing logged yet today' };
    return { icon: '✅', text: 'Protein target met, calories on track' };
  }

  // Small, low-effort/high-protein foods for closing out a gap after dinner.
  // Logic lives in finish-your-day.js, shared with the hub — see that file to change the food list.
  function finishYourDay(t, tg) {
    return window.FinishYourDay ? window.FinishYourDay.compute(t, tg, 2) : null;
  }

  function passwordModalHtml(errMsg) {
    return `
      <div class="mt-modal-wrap"><div class="mt-modal">
        <h2>App password needed</h2>
        <p>Enter the password you set for this app to save. Reading your log doesn't need it — only saving changes does.</p>
        <label>Password</label><input id="pw-input" type="password" placeholder="" />
        ${errMsg ? `<div class="mt-modal-err">${escapeHtml(errMsg)}</div>` : ''}
        <button class="mt-add-btn" style="margin-top:14px" id="pw-save">Save</button>
      </div></div>`;
  }
  function attachPasswordModal() {
    const btn = document.getElementById('pw-save');
    if (!btn) return;
    const submit = async () => {
      const pw = document.getElementById('pw-input').value.trim();
      if (!pw) return;
      localStorage.setItem(LS_PASSWORD, pw);
      state.needsPassword = false;
      await persist();
    };
    btn.onclick = submit;
    document.getElementById('pw-input').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  }

  function computeInsights(last7, avg, allDates, symptomDates) {
    const insights = [];
    if (last7.length) {
      const hit = last7.filter(d => totalsFor(d).protein >= targetForDate(d).protein).length;
      insights.push({ icon: '🎯', text: `Protein target hit ${hit}/${last7.length} of the last ${last7.length} logged days` });
      const calAvg = avg('cal');
      const stdCal = state.targetPresets.standard.cal;
      const diff = calAvg - stdCal;
      insights.push({ icon: '📊', text: `7-day average: ${calAvg} kcal (${diff >= 0 ? '+' : ''}${diff} vs standard target)` });
    }
    if (state.vitalsWeight && state.vitalsWeight.length >= 8) {
      const sorted = [...state.vitalsWeight].sort((a,b) => a.date.localeCompare(b.date));
      const recent7 = sorted.slice(-7).map(w => w.value);
      const prior7 = sorted.slice(-14, -7).map(w => w.value);
      if (recent7.length && prior7.length) {
        const r = recent7.reduce((a,b) => a+b, 0) / recent7.length;
        const p = prior7.reduce((a,b) => a+b, 0) / prior7.length;
        const delta = r - p;
        insights.push({ icon: '⚖️', text: `Weight: ${r.toFixed(1)} lb (7-day avg), ${delta >= 0 ? '+' : ''}${delta.toFixed(1)} lb vs the prior week` });
      }
    }
    const symDates = [...symptomDates];
    const nonSymDates = allDates.filter(d => !symptomDates.has(d));
    if (symDates.length >= 3 && nonSymDates.length >= 3) {
      const symFatAvg = symDates.reduce((s,d) => s+totalsFor(d).fat, 0) / symDates.length;
      const nonSymFatAvg = nonSymDates.reduce((s,d) => s+totalsFor(d).fat, 0) / nonSymDates.length;
      if (nonSymFatAvg > 0 && symFatAvg > nonSymFatAvg * 1.15) {
        insights.push({ icon: '🔍', text: `Symptom days average ${Math.round(symFatAvg)}g fat vs ${Math.round(nonSymFatAvg)}g on other days — might be worth watching` });
      }
    } else if (symDates.length > 0) {
      insights.push({ icon: '🔍', text: `${symDates.length} symptom day${symDates.length===1?'':'s'} logged so far — a few more will help spot patterns` });
    }
    return insights;
  }

  function render() {
    if (!state.loaded) { root.innerHTML = '<div class="mt-loading">loading log&hellip;</div>'; return; }

    const t = totalsFor(state.currentDate);
    const presetKey = state.dayTypes[state.currentDate] || 'standard';
    const tg = state.targetPresets[presetKey];
    const { label: dateLabel, isToday } = fmtDateLabel(state.currentDate);
    const dayEntriesAll = state.entries.filter(e => e.date === state.currentDate).sort((a,b) => (a.time||'').localeCompare(b.time||''));
    const dayEntries = dayEntriesAll.filter(e => e.kind !== 'symptom');
    const daySymptoms = dayEntriesAll.filter(e => e.kind === 'symptom');
    const mealGroups = {};
    dayEntries.forEach(e => { (mealGroups[e.meal] = mealGroups[e.meal] || []).push(e); });
    const calRange = rangeFor(tg.cal, 0.08);
    const calOver = t.cal > calRange.hi;
    const priority = priorityHint(t, tg, calRange);
    const dinnerLogged = dayEntries.some(e => e.meal === 'Dinner' && e.status !== 'estimating');
    const finishers = (isToday && dinnerLogged) ? finishYourDay(t, tg) : null;

    const allDates = Array.from(new Set(state.entries.map(e => e.date))).sort();
    const symptomDates = new Set(state.entries.filter(e => e.kind === 'symptom').map(e => e.date));
    const dateSet = new Set(allDates);
    let streak = 0;
    { let d = todayStr(); if (!dateSet.has(d)) d = shiftDate(d, -1);
      while (dateSet.has(d)) { streak++; d = shiftDate(d, -1); } }
    const last7 = allDates.slice(-7);
    const avg = (key) => last7.length ? Math.round(last7.reduce((s,d)=>s+totalsFor(d)[key],0)/last7.length) : 0;
    const histDates = allDates.filter(d => d !== state.currentDate).sort().reverse().slice(0, 14);
    const insights = computeInsights(last7, avg, allDates, symptomDates);

    root.innerHTML = (state.needsPassword ? passwordModalHtml() : '') + `
      <p class="mt-eyebrow">🥗 Daily Intake Ledger &middot; dairy-free &middot; synced to github.com/aaronlikeshoobs/macro-log
        <button id="mt-sync-btn" style="float:right; background:none; border:1px solid var(--muted); color:var(--muted); font-family:var(--font-mono); font-size:10px; padding:9px 12px; min-height:38px; cursor:pointer; text-transform:uppercase; letter-spacing:0.05em; border-radius:6px;">&#8635; Refresh</button>
      </p>
      <h1 class="mt-title">Macro Log</h1>

      <div class="mt-datebar">
        <button id="mt-prev" aria-label="Previous day">&larr;</button>
        <div class="mt-date-label">${dateLabel}<span class="mt-date-sub">${isToday ? 'TODAY' : state.currentDate}</span></div>
        <button id="mt-next" ${isToday ? 'disabled' : ''} aria-label="Next day">&rarr;</button>
      </div>

      <div class="mt-preset-row">
        ${Object.entries(state.targetPresets).map(([key,p]) => `
          <button class="mt-preset-pill ${presetKey===key?'active':''}" data-preset="${key}">${escapeHtml(p.label||key)}</button>
        `).join('')}
      </div>

      <div class="mt-label">
        <div class="mt-label-head">Today's Intake</div>
        <div class="mt-label-sub"><span>${dayEntries.length} item${dayEntries.length===1?'':'s'} logged${dayEntries.filter(e=>e.status==='pending'||e.status==='estimating').length ? ` &middot; ${dayEntries.filter(e=>e.status==='pending'||e.status==='estimating').length} awaiting estimate` : ''}</span><span>${escapeHtml(tg.label||'Standard')}</span></div>
        <div class="mt-cal-row">
          <span class="mt-row-label">Calories</span>
          <span class="mt-row-val" style="color:${calOver?'var(--over)':'var(--ink)'}">${t.cal} <span style="font-size:14px;font-weight:400;color:var(--muted)">/ ${tg.cal}</span></span>
        </div>
        ${macroRow('Protein', '--protein', t.protein, tg.protein, 'g', { mode: 'min' })}
        ${macroRow('Fat', '--fat', t.fat, tg.fat, 'g', { tolerance: 0.15 })}
        ${macroRow('Carbs', '--carb', t.carb, tg.carb, 'g', { tolerance: 0.15 })}
        <div style="padding-top:10px; font-family:var(--font-mono); font-size:11px; color:${calOver ? 'var(--over)' : 'var(--muted)'}">
          ${calOver ? `${t.cal - tg.cal} kcal over target` : `${tg.cal - t.cal} kcal remaining`}
        </div>
        <div class="mt-priority" style="color:${priority.icon==='⚠️'?'var(--over)':priority.icon==='✅'?'var(--protein)':'var(--ink)'}">
          <span>${priority.icon}</span><span>${priority.text}</span>
        </div>
      </div>

      ${finishers && finishers.length ? `
        <div class="mt-finish">
          <div class="mt-finish-head">🍽️ Finish your day</div>
          ${finishers.map(f => `
            <div class="mt-finish-item">
              <div class="name">${escapeHtml(f.name)}</div>
              <div class="macros">${f.cal} kcal &middot; P${f.protein} F${f.fat} C${f.carb} &middot; ${f.deltaText}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}

      <div class="mt-section-title">📝 Log an Entry</div>
      <div class="mt-tabs">
        <button class="mt-tab ${state.entryTab==='meal' ? 'active' : ''}" data-tab="meal">🍴 Meal</button>
        <button class="mt-tab ${state.entryTab==='symptom' ? 'symptom-active' : ''}" data-tab="symptom">⚠️ Upset stomach / BM</button>
      </div>
      <div class="mt-form">
        ${state.entryTab === 'meal' ? `
          <div class="mt-form-row">
            <div class="mt-form-name" style="flex:3 1 220px;"><label>What did you eat?</label><input id="mt-in-name" type="text" placeholder="e.g. Turkey chili, one bowl, no cheese" autocapitalize="sentences" autocomplete="off" autocorrect="on" enterkeyhint="done" /></div>
            <div class="mt-form-meal"><label>Meal</label>
              <select id="mt-in-meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select>
            </div>
          </div>
        ` : `
          <label style="font-family:var(--font-mono); font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:0.05em; display:block; margin-bottom:5px;">Type</label>
          <select id="mt-in-symptype" style="font-size:16px; padding:12px 10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); width:100%; border-radius:4px; min-height:44px; margin-bottom:8px;">
            <option>Upset stomach</option><option>Loose stool / diarrhea</option><option>Constipation</option><option>Bloating / gas</option><option>Nausea</option><option>Other</option>
          </select>
          <label style="font-family:var(--font-mono); font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:0.05em; display:block; margin-bottom:5px;">Severity</label>
          <div class="mt-sev-row">
            <button type="button" class="mt-sev-btn ${state.severity==='Mild'?'active':''}" data-sev="Mild">Mild</button>
            <button type="button" class="mt-sev-btn ${state.severity==='Moderate'?'active':''}" data-sev="Moderate">Moderate</button>
            <button type="button" class="mt-sev-btn ${state.severity==='Severe'?'active':''}" data-sev="Severe">Severe</button>
          </div>
          <label style="font-family:var(--font-mono); font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:0.05em; display:block; margin-bottom:5px;">Notes (optional)</label>
          <input id="mt-in-symptom" type="text" placeholder="e.g. started ~2pm, about an hour after lunch" autocapitalize="sentences" autocomplete="off" enterkeyhint="done" style="margin-bottom:0;" />
        `}
        <button class="mt-add-btn" id="mt-add-btn" style="margin-top:10px; ${state.entryTab==='symptom' ? 'background:var(--over);' : ''}" ${state.syncing?'disabled':''}>${state.syncing ? 'Saving\u2026' : (state.entryTab === 'meal' ? `+ Add to ${isToday ? "today's" : "this day's"} log` : '+ Log symptom')}</button>
      </div>
      <div class="mt-sync ${state.syncErr ? 'err' : ''}">${state.syncErr ? 'Sync error: ' + escapeHtml(state.syncErr) : 'Synced to GitHub &middot; macros estimated by Claude'}</div>

      <div class="mt-section-title">📋 Entries &mdash; ${dateLabel}</div>
      <div id="mt-log-list">
        ${daySymptoms.length ? daySymptoms.map(s => `
          <div class="mt-symptom-item">
            <div><span class="mt-symptom-tag">${escapeHtml(s.severity)}</span>${escapeHtml(s.type)}${s.note ? ' &mdash; ' + escapeHtml(s.note) : ''}</div>
            <button class="mt-del" data-id="${s.id}" aria-label="Delete entry">&times;</button>
          </div>
        `).join('') : ''}
        ${dayEntries.length === 0 && daySymptoms.length === 0 ? '<div class="mt-empty">Nothing logged yet.</div>' :
          dayEntries.length === 0 ? '' :
          Object.keys(mealGroups).map(meal => `
            <div class="mt-log-meal" style="margin-top:10px">${meal}</div>
            ${mealGroups[meal].map(e => `
              <div class="mt-log-item">
                <div>${escapeHtml(e.name)}</div>
                <div style="display:flex; align-items:center;">
                  <div class="mt-log-macros">${e.status === 'estimating' ? '<span style="color:var(--fat)">calculating&hellip;</span>' : e.status === 'pending' ? '<span style="color:var(--over)">couldn\'t estimate</span>' : `${e.cal} kcal &middot; P${e.protein} F${e.fat} C${e.carb}`}</div>
                  <button class="mt-del" data-id="${e.id}" aria-label="Delete entry">&times;</button>
                </div>
              </div>
            `).join('')}
          `).join('')
        }
      </div>

      <div class="mt-section-title" style="display:flex; justify-content:space-between; align-items:baseline;"><span>📊 Last ${last7.length || 0}-Day Average</span><span style="font-family:var(--font-mono); font-size:11px; text-transform:none; letter-spacing:0; color:var(--protein)">${streak} day${streak===1?'':'s'} logging streak</span></div>
      <div class="mt-week-summary">
        <div class="mt-week-cell"><span class="mt-week-num">${avg('cal')}</span><span class="mt-week-lbl">kcal</span></div>
        <div class="mt-week-cell"><span class="mt-week-num" style="color:var(--protein)">${avg('protein')}g</span><span class="mt-week-lbl">protein</span></div>
        <div class="mt-week-cell"><span class="mt-week-num" style="color:var(--fat)">${avg('fat')}g</span><span class="mt-week-lbl">fat</span></div>
        <div class="mt-week-cell"><span class="mt-week-num" style="color:var(--carb)">${avg('carb')}g</span><span class="mt-week-lbl">carbs</span></div>
      </div>

      <div class="mt-section-title">📈 Trends</div>
      <div class="mt-trends">
        ${insights.length ? insights.map(i => `<div class="mt-insight"><span class="em">${i.icon}</span><span>${i.text}</span></div>`).join('') : '<div class="mt-empty">Log a few more days to see trends here.</div>'}
      </div>

      <div class="mt-section-title">🕐 History</div>
      <div id="mt-hist-list">
        ${histDates.length === 0 ? '<div class="mt-empty">No earlier days logged yet.</div>' :
          histDates.map(d => {
            const dt = totalsFor(d);
            const dtg = targetForDate(d);
            const { label } = fmtDateLabel(d);
            const cp = Math.min(pct(dt.cal, dtg.cal), 100);
            const pp = Math.min(pct(dt.protein, dtg.protein), 100);
            const fp = Math.min(pct(dt.fat, dtg.fat), 100);
            const cbp = Math.min(pct(dt.carb, dtg.carb), 100);
            return `
              <div class="mt-hist-item" data-date="${d}">
                <div class="mt-hist-head"><span class="mt-hist-date">${label}${symptomDates.has(d) ? '<span class="mt-hist-symptom-dot" title="Symptom logged"></span>' : ''}</span><span class="mt-hist-cal" style="color:${dt.cal>dtg.cal*1.08?'var(--over)':'var(--ink)'}">${dt.cal} kcal</span></div>
                <div class="mt-hist-bars">
                  <div><span style="width:${cp}%; background:var(--ink)"></span></div>
                  <div><span style="width:${pp}%; background:var(--protein)"></span></div>
                  <div><span style="width:${fp}%; background:var(--fat)"></span></div>
                  <div><span style="width:${cbp}%; background:var(--carb)"></span></div>
                </div>
                <div class="mt-hist-detail"><span>P ${dt.protein}g</span><span>F ${dt.fat}g</span><span>C ${dt.carb}g</span></div>
              </div>`;
          }).join('')
        }
      </div>

      <div class="mt-note">Just type what you ate — macros are estimated automatically by Claude right after you log it. If a call fails, the entry shows "couldn't estimate" and will be filled in the next time you're in chat. Dairy-free is assumed by default; call it out in the text if something isn't.</div>
      <button class="mt-fab" id="mt-fab" aria-label="Quick log a meal">+</button>
    `;

    document.getElementById('mt-prev').onclick = () => { state.currentDate = shiftDate(state.currentDate, -1); render(); };
    const nextBtn = document.getElementById('mt-next');
    if (nextBtn) nextBtn.onclick = () => { state.currentDate = shiftDate(state.currentDate, 1); render(); };

    root.querySelectorAll('.mt-preset-pill').forEach(btn => {
      btn.onclick = async () => { state.dayTypes[state.currentDate] = btn.dataset.preset; await persist(); };
    });

    attachPasswordModal();

    document.getElementById('mt-add-btn').onclick = async () => {
      if (document.activeElement) document.activeElement.blur();
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      let entry;
      if (state.entryTab === 'meal') {
        const name = document.getElementById('mt-in-name').value.trim();
        const meal = document.getElementById('mt-in-meal').value;
        if (!name) return;
        entry = {
          id: 'e-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
          date: state.currentDate, meal, name,
          cal: null, protein: null, fat: null, carb: null, status: 'estimating',
          time: timeStr,
        };
      } else {
        const type = document.getElementById('mt-in-symptype').value;
        const note = document.getElementById('mt-in-symptom').value.trim();
        entry = {
          id: 'e-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
          date: state.currentDate, kind: 'symptom', type, severity: state.severity, note,
          time: timeStr,
        };
      }
      state.entries.push(entry);
      const q = loadQueue(); q.push(entry); saveQueue(q); // survive a reload even if the write below fails
      if (state.entryTab === 'meal') { document.getElementById('mt-in-name').value = ''; }
      else { document.getElementById('mt-in-symptom').value = ''; }
      await persist();

      if (entry.status === 'estimating') {
        try {
          const items = await estimateItems(entry.name);
          // replace the single placeholder with one entry per food item
          state.entries = state.entries.filter(e => e.id !== entry.id);
          const newEntries = items.map((it, i) => ({
            id: 'e-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2,5),
            date: entry.date, meal: entry.meal, name: it.name,
            cal: it.cal, protein: it.protein, fat: it.fat, carb: it.carb,
            status: 'estimated', time: entry.time,
          }));
          state.entries.push(...newEntries);
          const q2 = loadQueue().filter(qe => qe.id !== entry.id);
          saveQueue(q2);
        } catch (e) {
          entry.status = 'pending'; // Claude will fill it in next time you're in chat
          const q2 = loadQueue().filter(qe => qe.id !== entry.id);
          q2.push(entry);
          saveQueue(q2);
        }
        await persist();
      }
    };

    root.querySelectorAll('.mt-tab').forEach(btn => {
      btn.onclick = () => { state.entryTab = btn.dataset.tab; autoFocusPending = true; render(); };
    });
    root.querySelectorAll('.mt-sev-btn').forEach(btn => {
      btn.onclick = () => { state.severity = btn.dataset.sev; render(); };
    });

    const nameInput = document.getElementById('mt-in-name');
    const symptomInput = document.getElementById('mt-in-symptom');
    const activeInput = nameInput || symptomInput;
    if (activeInput) {
      activeInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') document.getElementById('mt-add-btn').click(); });
      if (autoFocusPending) { activeInput.focus(); autoFocusPending = false; }
    }
    if (nameInput) {
      // default meal to whatever fits the time of day
      const hr = new Date().getHours();
      document.getElementById('mt-in-meal').value = hr < 11 ? 'Breakfast' : hr < 15 ? 'Lunch' : hr < 21 ? 'Dinner' : 'Snack';
    }

    const syncBtn = document.getElementById('mt-sync-btn');
    if (syncBtn) syncBtn.onclick = async () => { state.loaded = false; render(); await loadData(); };

    const fab = document.getElementById('mt-fab');
    if (fab) fab.onclick = () => {
      activeInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => activeInput.focus(), 300);
    };

    root.querySelectorAll('.mt-del').forEach(btn => {
      btn.onclick = async () => {
        state.entries = state.entries.filter(e => e.id !== btn.dataset.id);
        await persist();
      };
    });
    root.querySelectorAll('.mt-hist-item').forEach(item => {
      item.onclick = () => { state.currentDate = item.dataset.date; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    });
  }

  loadData();
})();
</script>
</body>
</html>
